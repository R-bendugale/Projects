<!DOCTYPE html>
<html>
<head>
    <title>Currency Converter</title>
</head>

<body>

<h1>Currency Converter</h1>

<form method="POST">

    <label>Amount:</label><br>
    <input type="number" name="amount" step="0.01" required><br><br>

    <label>From Currency:</label><br>
    <select name="from">
        <option>USD</option>
        <option>INR</option>
        <option>EUR</option>
        <option>GBP</option>
    </select>

    <br><br>

    <label>To Currency:</label><br>
    <select name="to">
        <option>USD</option>
        <option>INR</option>
        <option>EUR</option>
        <option>GBP</option>
    </select>

    <br><br>

    <input type="submit" value="Convert">

</form>

<h2>{{ result }}</h2>

</body>
</html>
