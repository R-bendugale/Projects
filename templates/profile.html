{% extends "base.html" %}{% block title %}My profile · CampusShare{% endblock %}
{% block content %}<div class="form-page"><div class="form-card wide"><span class="eyebrow">YOUR DETAILS</span><h2>My profile</h2><p class="muted">Keep your campus information up to date.</p><form method="post"><div class="form-grid"><label>Full name<input name="name" value="{{ user.name }}" required></label><label>Email address<input value="{{ user.email }}" disabled><small>Email cannot be changed here.</small></label><label class="span-two">Department<input name="department" value="{{ user.department }}" required></label><label>Member since<input value="{{ user.created_at|dt('%d %B %Y') }}" disabled></label></div><div class="form-actions"><button class="btn btn-primary">Save profile →</button></div></form></div></div>{% endblock %}
